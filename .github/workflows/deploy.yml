# نشر تلقائي على GitHub Pages عند كل دفع إلى main
name: نشر المنصة

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: تثبيت الحزم
        run: npm ci

      - name: فحص الأنواع
        run: npm run typecheck

      # القيم الثلاث أدناه لها قيمة احتياطية مكتوبة هنا، فيعمل النشر فور
      # دفع الكود بلا أي ضبط يدوي للمستودع. وإن عُرّف متغيّر بنفس الاسم في
      # Settings ▸ Secrets and variables ▸ Actions ▸ Variables فهو الذي يُستخدم.
      #
      # المفتاح المكتوب هنا هو المفتاح العام (publishable) وحده، وهو مُصمَّم
      # للعمل داخل المتصفح ويظهر أصلًا في كود الموقع المنشور — الحماية الحقيقية
      # من سياسات RLS داخل قاعدة البيانات. لا يُكتب مفتاح service_role هنا أبدًا.
      - name: البناء
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://zzvppaaitnajwfbguwbt.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'sb_publishable_9tRiTSvlrBljq_G5A6oXcw_euu9gYaw' }}
          VITE_BASE: ${{ vars.VITE_BASE || '/trb-training-center/' }}
        run: npm run build

      - name: تهيئة توجيه التطبيق أحادي الصفحة
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
