<html lang="ar" dir="rtl">

    <meta charset="UTF-8" />

    <meta name="theme-color" content="#0a1c38" />
    <link rel="icon" type="image/png" href="./logo.png" />

    <!-- تطبيق قابل للتثبيت على الجوال -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="مركز التدريب" />
    <meta name="application-name" content="مركز التدريب" />

    <title>مركز تدريب شركة ترسانة الإسكندرية</title>
    <meta name="description" content="البوابة الرقمية الرسمية لمركز تدريب شركة ترسانة الإسكندرية — التخصصات الفنية، المكتبة الإلكترونية، الفيديوهات التعليمية، الأخبار، الشكاوى والمقترحات، وبوابة ولي الأمر." />
    <link rel="canonical" href="/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="مركز تدريب شركة ترسانة الإسكندرية" />
    <meta property="og:title" content="مركز تدريب شركة ترسانة الإسكندرية" />
    <meta property="og:description" content="تعليم فني وتدريب عملي حقيقي داخل بيئة إنتاجية عاملة — دبلوم فني مدته ثلاث سنوات في سبعة تخصصات." />
    <meta property="og:image" content="/logo.png" />
    <meta property="og:locale" content="ar_EG" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- يُطبَّق الوضع قبل رسم الصفحة حتى لا يحدث وميض أبيض في الوضع الليلي -->
    <script>
      (function () {
        try {
          var c = localStorage.getItem('trb.theme') || 'system';
          var d = c === 'dark' || (c === 'system' &&
                  window.matchMedia('(prefers-color-scheme: dark)').matches);
          var r = document.documentElement;
          r.setAttribute('data-theme', d ? 'dark' : 'light');
          r.style.colorScheme = d ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>هذا الموقع يحتاج إلى تفعيل JavaScript في المتصفح.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
